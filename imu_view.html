<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IMU Visualizer</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#050510; color:#e0e0f0; font-family:monospace; overflow:hidden; }
  #canvas-container { width:100vw; height:100vh; }

  /* ── Kalibrasyon ekranı ── */
  #cal-screen {
    position:fixed; inset:0; background:#050510;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    z-index:100;
  }
  #cal-screen h1 { color:#5599dd; letter-spacing:3px; margin-bottom:32px; font-size:18px; }
  #cal-box {
    background:rgba(10,20,50,0.9); border:1px solid #335;
    border-radius:12px; padding:40px 48px; text-align:center;
    min-width:360px;
  }
  #cal-step-num { color:#446; font-size:12px; margin-bottom:8px; }
  #cal-icon { font-size:72px; margin:16px 0; line-height:1; }
  #cal-text { font-size:16px; line-height:1.7; color:#cce; margin-bottom:28px; white-space:pre-line; }
  #cal-bar {
    height:6px; background:#112; border-radius:3px;
    margin-bottom:28px; overflow:hidden;
  }
  #cal-progress { height:100%; background:#2266cc; width:0%; transition:width 1.2s linear; }
  #cal-btn {
    background:#0d3080; border:1px solid #4488ff; color:#aaccff;
    padding:12px 40px; border-radius:8px; cursor:pointer;
    font-size:14px; letter-spacing:2px; font-family:monospace;
    transition:background 0.2s;
  }
  #cal-btn:hover { background:#1a4aaa; }
  #cal-btn:disabled { opacity:0.4; cursor:default; }
  #cal-accel {
    margin-top:20px; font-size:12px; color:#446;
    display:flex; gap:16px; justify-content:center;
  }
  #cal-accel span { color:#668; }
  #cal-accel .val { color:#88aadd; }

  /* ── HUD (görselleştirme ekranı) ── */
  #hud {
    position:fixed; top:16px; left:16px; display:none;
    background:rgba(0,0,10,0.75); border:1px solid #223355;
    border-radius:8px; padding:12px 16px; font-size:12px; line-height:1.9;
    min-width:200px; backdrop-filter:blur(4px);
  }
  #hud .label { color:#5599dd; font-size:10px; text-transform:uppercase; letter-spacing:1px; }
  #hud .val   { color:#e8f0ff; }
  #source { color:#44cc88; font-size:11px; }
  #status { position:fixed; top:16px; right:16px; font-size:12px; color:#446; display:none; }
  #btn-bar {
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    display:none; gap:10px;
  }
  .btn {
    background:rgba(10,20,50,0.85); border:1px solid #3366aa;
    color:#88bbff; padding:8px 22px; border-radius:6px;
    cursor:pointer; font-size:12px; letter-spacing:1px;
    backdrop-filter:blur(4px); font-family:monospace;
  }
  .btn:hover { background:rgba(30,60,120,0.9); }
</style>
</head>
<body>

<!-- ── Kalibrasyon ekranı ────────────────────────────────────────── -->
<div id="cal-screen">
  <h1>IMU KALİBRASYON</h1>
  <div id="cal-box">
    <div id="cal-step-num">ADIM 1 / 2</div>
    <div id="cal-icon">⬜</div>
    <div id="cal-text">Sensörü düz bir yüzeye koy
chip yüzü yukarı baksın
sabit tut</div>
    <div id="cal-bar"><div id="cal-progress"></div></div>
    <button id="cal-btn" onclick="saveStep()">KAYDET</button>
    <div id="cal-accel">
      <span>X: <span class="val" id="ca-x">0.000</span></span>
      <span>Y: <span class="val" id="ca-y">0.000</span></span>
      <span>Z: <span class="val" id="ca-z">0.000</span></span>
    </div>
  </div>
</div>

<!-- ── 3D canvas ─────────────────────────────────────────────────── -->
<div id="canvas-container"></div>

<div id="hud">
  <div id="source">&#x25CF; <span id="src-label">connecting...</span></div>
  <br>
  <span class="label">Quaternion</span><br>
  w:<span class="val" id="qw">1</span>
  x:<span class="val" id="qx">0</span>
  y:<span class="val" id="qy">0</span>
  z:<span class="val" id="qz">0</span><br>
  <br>
  <span class="label">Accel g</span><br>
  x:<span class="val" id="ax">0</span>
  y:<span class="val" id="ay">0</span>
  z:<span class="val" id="az">0</span>
</div>
<div id="status">&#x25CF; waiting</div>
<div id="btn-bar">
  <button class="btn" onclick="resetQuat()">SIFIRLA</button>
  <button class="btn" onclick="restartCal()">YENİDEN KALİBRE</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════
//  KALIBRASYON
// ═══════════════════════════════════════════════════════════════════
const CAL_STEPS = [
  {
    num: "ADIM 1 / 2",
    icon: "⬜",
    text: "Sensörü düz bir yüzeye koy\nchip yüzü yukarı baksın\nsabit tut"
  },
  {
    num: "ADIM 2 / 2",
    icon: "↗",
    text: "Sensörün ÖN tarafını\nyukarı kaldır (~45°)\nsabit tut"
  }
];

let calStep = 0;
let calSamples = [];
let liveAccel = [0,0,0];
let calRunning = false;

// Canlı accel güncelle
setInterval(async () => {
  try {
    const r = await fetch('http://localhost:8765/data',{cache:'no-store'});
    const d = await r.json();
    liveAccel = [d.ax, d.ay, d.az];
    document.getElementById('ca-x').textContent = d.ax.toFixed(3);
    document.getElementById('ca-y').textContent = d.ay.toFixed(3);
    document.getElementById('ca-z').textContent = d.az.toFixed(3);
  } catch(e){}
}, 100);

async function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function sampleAccel(n=40){
  let s=[0,0,0];
  for(let i=0;i<n;i++){
    try{
      const r=await fetch('http://localhost:8765/data',{cache:'no-store'});
      const d=await r.json();
      s[0]+=d.ax; s[1]+=d.ay; s[2]+=d.az;
    }catch(e){}
    await sleep(30);
  }
  return s.map(v=>v/n);
}

async function saveStep(){
  if(calRunning) return;
  calRunning = true;
  const btn = document.getElementById('cal-btn');
  btn.disabled = true;
  btn.textContent = 'ÖRNEKLENİYOR...';

  // Progress bar
  const prog = document.getElementById('cal-progress');
  prog.style.width = '0%';
  await sleep(50);
  prog.style.width = '100%';

  const sample = await sampleAccel(40);
  calSamples.push(sample);

  calStep++;
  if(calStep < CAL_STEPS.length){
    const s = CAL_STEPS[calStep];
    document.getElementById('cal-step-num').textContent = s.num;
    document.getElementById('cal-icon').textContent = s.icon;
    document.getElementById('cal-text').textContent = s.text;
    prog.style.transition='none'; prog.style.width='0%';
    await sleep(50);
    prog.style.transition='width 1.2s linear';
    btn.textContent = 'KAYDET';
    btn.disabled = false;
    calRunning = false;
  } else {
    btn.textContent = 'HESAPLANIYOR...';
    await finishCal();
  }
}

async function finishCal(){
  const flat   = calSamples[0];  // düz
  const tilted = calSamples[1];  // öne eğik

  // UP ekseni: flat'te en büyük mutlak değer
  const absFlat = flat.map(Math.abs);
  const upIdx   = absFlat.indexOf(Math.max(...absFlat));
  const upSign  = flat[upIdx] > 0 ? 1 : -1;

  // PITCH ekseni: flat→tilted'da en büyük değişim (up ekseni hariç)
  const delta = flat.map((v,i) => i===upIdx ? 0 : Math.abs(tilted[i]-v));
  const pitchIdx  = delta.indexOf(Math.max(...delta));
  // Öne eğince o eksen arttıysa sign=+1
  const pitchSign = (tilted[pitchIdx] - flat[pitchIdx]) > 0 ? 1 : -1;

  // ROLL ekseni: kalan
  const rollIdx = [0,1,2].find(i => i!==upIdx && i!==pitchIdx);

  // Mahony filter expects: gx=pitch, gy=roll, gz=up
  const order = [pitchIdx, rollIdx, upIdx];
  const sign  = [pitchSign, 1, upSign];

  try {
    await fetch('http://localhost:8765/config',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({order, sign})
    });
  } catch(e){}

  console.log('Cal done. order=',order,'sign=',sign);

  // Reset quaternion
  try { await fetch('http://localhost:8765/reset'); } catch(e){}

  // Görselleştirmeye geç
  document.getElementById('cal-screen').style.display = 'none';
  document.getElementById('hud').style.display = 'block';
  document.getElementById('status').style.display = 'block';
  document.getElementById('btn-bar').style.display = 'flex';
  startFetch();
}

function restartCal(){
  calStep = 0; calSamples = [];
  const s = CAL_STEPS[0];
  document.getElementById('cal-step-num').textContent = s.num;
  document.getElementById('cal-icon').textContent = s.icon;
  document.getElementById('cal-text').textContent = s.text;
  const prog = document.getElementById('cal-progress');
  prog.style.transition='none'; prog.style.width='0%';
  const btn = document.getElementById('cal-btn');
  btn.textContent='KAYDET'; btn.disabled=false;
  calRunning=false;
  document.getElementById('cal-screen').style.display='flex';
  document.getElementById('hud').style.display='none';
  document.getElementById('status').style.display='none';
  document.getElementById('btn-bar').style.display='none';
}

// ═══════════════════════════════════════════════════════════════════
//  THREE.JS
// ═══════════════════════════════════════════════════════════════════
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.getElementById('canvas-container').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050510);

// Yıldızlar
(function(){
  const geo = new THREE.BufferGeometry();
  const v = [];
  for(let i=0;i<2000;i++){
    const r=80+Math.random()*20, t=Math.random()*Math.PI*2, p=Math.acos(2*Math.random()-1);
    v.push(r*Math.sin(p)*Math.cos(t), r*Math.cos(p), r*Math.sin(p)*Math.sin(t));
  }
  geo.setAttribute('position', new THREE.Float32BufferAttribute(v,3));
  scene.add(new THREE.Points(geo, new THREE.PointsMaterial({color:0xffffff,size:0.15})));
})();

const camera = new THREE.PerspectiveCamera(42, window.innerWidth/window.innerHeight, 0.1, 200);
camera.position.set(3.5, 2.5, 4.5);
camera.lookAt(0,0,0);

scene.add(new THREE.AmbientLight(0x334466, 1.5));
const sun = new THREE.DirectionalLight(0xfff5e0, 2.0);
sun.position.set(8,10,6); scene.add(sun);
scene.add(new THREE.AxesHelper(1.5));

const sat = new THREE.Group();
scene.add(sat);

// ── CubeSat gövdesi ──
function makeLabel(text, bg){
  const c=document.createElement('canvas'); c.width=256; c.height=256;
  const ctx=c.getContext('2d');
  ctx.fillStyle=bg; ctx.fillRect(0,0,256,256);
  ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=8;
  ctx.strokeRect(6,6,244,244);
  ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='bold 56px monospace'; ctx.fillText(text,128,128);
  return new THREE.CanvasTexture(c);
}

// BoxGeometry yüz sırası: +X, -X, +Y, -Y, +Z, -Z
const bodyMats = [
  new THREE.MeshPhongMaterial({map:makeLabel('SAĞ','#6b1a1a'),  shininess:60}),
  new THREE.MeshPhongMaterial({map:makeLabel('SOL','#1a4a1a'),  shininess:60}),
  new THREE.MeshPhongMaterial({map:makeLabel('ÜST','#6b5a00'),  shininess:60}),
  new THREE.MeshPhongMaterial({map:makeLabel('ALT','#2a0a4a'),  shininess:60}),
  new THREE.MeshPhongMaterial({map:makeLabel('ÖN','#0a3a5a'),   shininess:60}),
  new THREE.MeshPhongMaterial({map:makeLabel('ARKA','#1a1a2a'), shininess:60}),
];

const body = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), bodyMats);
sat.add(body);
sat.add(new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(1,1,1)),
  new THREE.LineBasicMaterial({color:0x4488cc})
));

// Güneş panelleri
[-1,1].forEach(side=>{
  const grp = new THREE.Group();
  grp.position.set(side*(0.5+0.7+0.04),0,0);
  const panel = new THREE.Mesh(
    new THREE.BoxGeometry(1.4,0.88,0.025),
    new THREE.MeshPhongMaterial({color:0x1a6b8a, emissive:0x082030, emissiveIntensity:0.4, shininess:160})
  );
  grp.add(panel);
  const lineMat = new THREE.LineBasicMaterial({color:0x0a3040});
  for(let c=1;c<4;c++){
    const x=-0.7+c*(1.4/4), g=new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(x,-0.44,0.013), new THREE.Vector3(x,0.44,0.013)]);
    grp.add(new THREE.Line(g,lineMat));
  }
  for(let r=1;r<3;r++){
    const y=-0.44+r*(0.88/3), g=new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(-0.7,y,0.013), new THREE.Vector3(0.7,y,0.013)]);
    grp.add(new THREE.Line(g,lineMat));
  }
  sat.add(grp);
});

// ── Quaternion ──
const targetQuat = new THREE.Quaternion();
const smoothQuat  = new THREE.Quaternion();
const QFIX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), -Math.PI/2);

function applyServerQuat(w,x,y,z){
  targetQuat.set(x,y,z,w).premultiply(QFIX);
}

// ── Veri çekme ──
let fetchActive = false;
function startFetch(){
  fetchActive = true;
}

async function fetchData(){
  if(!fetchActive) return;
  try{
    const r=await fetch('http://localhost:8765/data',{cache:'no-store'});
    const d=await r.json();
    applyServerQuat(d.q[0],d.q[1],d.q[2],d.q[3]);
    document.getElementById('qw').textContent=d.q[0].toFixed(3)+' ';
    document.getElementById('qx').textContent=d.q[1].toFixed(3)+' ';
    document.getElementById('qy').textContent=d.q[2].toFixed(3)+' ';
    document.getElementById('qz').textContent=d.q[3].toFixed(3);
    document.getElementById('ax').textContent=d.ax.toFixed(3)+' ';
    document.getElementById('ay').textContent=d.ay.toFixed(3)+' ';
    document.getElementById('az').textContent=d.az.toFixed(3);
    document.getElementById('src-label').textContent=d.source;
    document.getElementById('status').style.color='#4a4';
    document.getElementById('status').textContent='● connected';
  }catch(e){
    document.getElementById('status').style.color='#a44';
    document.getElementById('status').textContent='● disconnected';
  }
}
setInterval(fetchData,50);

function resetQuat(){
  fetch('http://localhost:8765/reset');
  targetQuat.set(0,0,0,1); smoothQuat.set(0,0,0,1);
}

// ── Mouse orbit ──
let camTheta=0.87, camPhi=0.55, camR=6.5;
let dragActive=false, dragX=0, dragY=0;
function updateCamera(){
  camera.position.set(
    camR*Math.sin(camPhi)*Math.sin(camTheta),
    camR*Math.cos(camPhi),
    camR*Math.sin(camPhi)*Math.cos(camTheta)
  );
  camera.lookAt(0,0,0);
}
updateCamera();
renderer.domElement.addEventListener('mousedown',e=>{dragActive=true;dragX=e.clientX;dragY=e.clientY;});
window.addEventListener('mouseup',()=>dragActive=false);
window.addEventListener('mousemove',e=>{
  if(!dragActive)return;
  camTheta-=(e.clientX-dragX)*0.008;
  camPhi=Math.max(0.05,Math.min(Math.PI-0.05,camPhi-(e.clientY-dragY)*0.008));
  dragX=e.clientX;dragY=e.clientY;
  updateCamera();
});
renderer.domElement.addEventListener('wheel',e=>{
  camR=Math.max(2,Math.min(20,camR+e.deltaY*0.01));
  updateCamera();
},{passive:true});

window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

function animate(){
  requestAnimationFrame(animate);
  smoothQuat.slerp(targetQuat,0.12);
  sat.quaternion.copy(smoothQuat);
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
