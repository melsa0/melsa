<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>CubeSat-1 · Sticker Pack</title>
<style>
@page { size: A4 portrait; margin: 5mm; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #999; font-family: 'Courier New', monospace; }
.page { width: 200mm; background: white; margin: 0 auto 8mm; padding: 2mm; page-break-after: always; }
.page:last-child { page-break-after: auto; }
.grid2 { display: grid; grid-template-columns: 100mm 100mm; }
.cap { font-size: 5.5pt; color: #888; text-align: center; padding: 1mm 0; letter-spacing: 0.4pt; text-transform: uppercase; }
.pcap { font-size: 5.5pt; color: #888; text-align: center; padding: 2.5mm 0 0.5mm; letter-spacing: 0.4pt; text-transform: uppercase; }
.face  { width: 100mm; height: 100mm; display: block; outline: 0.3mm dashed #bbb; }
.panel { width: 140mm; height: 88mm;  display: block; outline: 0.3mm dashed #bbb; margin: 0 auto; }
@media print {
  body { background: white; }
  .page { margin: 0; }
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }
}
</style>
</head>
<body>

<!-- ══════════════════════════ PAGE 1 ══════════════════════════ -->
<div class="page">
<div class="grid2">

<!-- ╔══════════════════════════════╗
     ║  TOP — Üst panel             ║
     ║  Merkez hedef + anten delikleri ║
     ╚══════════════════════════════╝ -->

  <line x1="88" y1="8"  x2="88" y2="16" stroke="#C9A227" stroke-width="0.35"/>

  <circle cx="12" cy="88" r="4"   fill="none" stroke="#C9A227" stroke-width="0.5"/>

  <line x1="88" y1="84" x2="88" y2="92" stroke="#C9A227" stroke-width="0.35"/>

  <!-- midpoint edge marks -->
  <line x1="48" y1="3"  x2="52" y2="3"  stroke="#C9A227" stroke-width="0.4"/>
  <line x1="48" y1="97" x2="52" y2="97" stroke="#C9A227" stroke-width="0.4"/>
  <line x1="3"  y1="48" x2="3"  y2="52" stroke="#C9A227" stroke-width="0.4"/>
  <line x1="97" y1="48" x2="97" y2="52" stroke="#C9A227" stroke-width="0.4"/>

  <!-- center precision target -->

  <circle cx="50" cy="50" r="12" fill="none" stroke="#00B4D8" stroke-width="0.35"/>

  <line x1="31" y1="50" x2="44" y2="50" stroke="#00B4D8" stroke-width="0.4"/>
  <line x1="56" y1="50" x2="69" y2="50" stroke="#00B4D8" stroke-width="0.4"/>
  <line x1="50" y1="31" x2="50" y2="44" stroke="#00B4D8" stroke-width="0.4"/>
  <line x1="50" y1="56" x2="50" y2="69" stroke="#00B4D8" stroke-width="0.4"/>

  <!-- diagonal tick marks at 45° around center ring -->

  <line x1="55.5" y1="44.5" x2="58.5" y2="41.5" stroke="#00B4D8" stroke-width="0.3" opacity="0.6"/>
  <line x1="41.5" y1="58.5" x2="44.5" y2="55.5" stroke="#00B4D8" stroke-width="0.3" opacity="0.6"/>
  <line x1="55.5" y1="55.5" x2="58.5" y2="58.5" stroke="#00B4D8" stroke-width="0.3" opacity="0.6"/>

  <line x1="0" y1="3.5" x2="3.5" y2="3.5" stroke="#aaa" stroke-width="0.3"/>
  <line x1="3.5" y1="0" x2="3.5" y2="3.5" stroke="#aaa" stroke-width="0.3"/>
  <line x1="100" y1="3.5" x2="96.5" y2="3.5" stroke="#aaa" stroke-width="0.3"/>
  <line x1="96.5" y1="0" x2="96.5" y2="3.5" stroke="#aaa" stroke-width="0.3"/>

  <line x1="3.5" y1="100" x2="3.5" y2="96.5" stroke="#aaa" stroke-width="0.3"/>

</div>

<!-- ╔══════════════════════════════╗
     ║  BOTTOM — Kapak              ║
     ║  M3 vida delikleri (4 köşe)  ║
     ╚══════════════════════════════╝ -->
<div>
<div class="cap">Alt Yüz · BOTTOM / Kapak</div>
<svg class="face" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="g2" width="5" height="5" patternUnits="userSpaceOnUse">
      <rect width="5" height="5" fill="#080E1A"/>

  </defs>
  <rect width="100" height="100" fill="url(#g2)"/>
  <rect x="3" y="3" width="94" height="94" fill="none" stroke="#C9A227" stroke-width="0.5"/>

  <rect x="12" y="12" width="76" height="76" fill="none" stroke="#C9A227" stroke-width="0.25" stroke-dasharray="3,2" opacity="0.5"/>

  <!-- M3 screw holes — CubeSat spec: 5mm from corner -->
  <!-- TL: (5,5) from corner → center at (8,8)? Let's use 10,10 -->
  <circle cx="10" cy="10" r="1.6" fill="none" stroke="#E0E0E0" stroke-width="0.6"/>
  <circle cx="10" cy="10" r="4"   fill="none" stroke="#C9A227" stroke-width="0.35" stroke-dasharray="1.5,1"/>
  <line x1="6"  y1="10" x2="14" y2="10" stroke="#E0E0E0" stroke-width="0.3"/>
  <line x1="10" y1="6"  x2="10" y2="14" stroke="#E0E0E0" stroke-width="0.3"/>

  <circle cx="90" cy="10" r="1.6" fill="none" stroke="#E0E0E0" stroke-width="0.6"/>
  <circle cx="90" cy="10" r="4"   fill="none" stroke="#C9A227" stroke-width="0.35" stroke-dasharray="1.5,1"/>
  <line x1="86" y1="10" x2="94" y2="10" stroke="#E0E0E0" stroke-width="0.3"/>
  <line x1="90" y1="6"  x2="90" y2="14" stroke="#E0E0E0" stroke-width="0.3"/>

  <circle cx="10" cy="90" r="1.6" fill="none" stroke="#E0E0E0" stroke-width="0.6"/>
  <circle cx="10" cy="90" r="4"   fill="none" stroke="#C9A227" stroke-width="0.35" stroke-dasharray="1.5,1"/>
  <line x1="6"  y1="90" x2="14" y2="90" stroke="#E0E0E0" stroke-width="0.3"/>
  <line x1="10" y1="86" x2="10" y2="94" stroke="#E0E0E0" stroke-width="0.3"/>

  <circle cx="90" cy="90" r="1.6" fill="none" stroke="#E0E0E0" stroke-width="0.6"/>
  <circle cx="90" cy="90" r="4"   fill="none" stroke="#C9A227" stroke-width="0.35" stroke-dasharray="1.5,1"/>
  <line x1="86" y1="90" x2="94" y2="90" stroke="#E0E0E0" stroke-width="0.3"/>
  <line x1="90" y1="86" x2="90" y2="94" stroke="#E0E0E0" stroke-width="0.3"/>

  <!-- center diamond reference -->
  <polygon points="50,35 65,50 50,65 35,50"
    fill="none" stroke="#C9A227" stroke-width="0.3" opacity="0.4"/>
  <circle cx="50" cy="50" r="2" fill="none" stroke="#C9A227" stroke-width="0.4"/>

  <!-- cut guides -->
  <line x1="0" y1="3.5" x2="3.5" y2="3.5" stroke="#aaa" stroke-width="0.3"/>
  <line x1="3.5" y1="0" x2="3.5" y2="3.5" stroke="#aaa" stroke-width="0.3"/>
  <line x1="100" y1="3.5" x2="96.5" y2="3.5" stroke="#aaa" stroke-width="0.3"/>
  <line x1="96.5" y1="0" x2="96.5" y2="3.5" stroke="#aaa" stroke-width="0.3"/>
  <line x1="0" y1="96.5" x2="3.5" y2="96.5" stroke="#aaa" stroke-width="0.3"/>
  <line x1="3.5" y1="100" x2="3.5" y2="96.5" stroke="#aaa" stroke-width="0.3"/>
  <line x1="100" y1="96.5" x2="96.5" y2="96.5" stroke="#aaa" stroke-width="0.3"/>
  <line x1="96.5" y1="100" x2="96.5" y2="96.5" stroke="#aaa" stroke-width="0.3"/>

</div><!-- row 1 -->
<div class="grid2">

  <rect x="3" y="3" width="94" height="94" fill="none" stroke="#C9A227" stroke-width="0.5"/>

  <!-- indicator notch on connector -->

  <!-- via fill dots at intersections -->

  <line x1="100" y1="3.5" x2="96.5" y2="3.5" stroke="#aaa" stroke-width="0.3"/>
  <line x1="96.5" y1="0" x2="96.5" y2="3.5" stroke="#aaa" stroke-width="0.3"/>

  <line x1="96.5" y1="100" x2="96.5" y2="96.5" stroke="#aaa" stroke-width="0.3"/>

<!-- ══════════════════════════ PAGE 2 ══════════════════════════ -->
<div class="page">
<div class="grid2">

<!-- ╔══════════════════════════════╗
     ║  LEFT — Sol panel            ║
     ║  Menteşe konumları           ║
     ╚══════════════════════════════╝ -->

<div class="cap">Sol Yüz · LEFT / Kanat Menteşe</div>
<svg class="face" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="g5" width="5" height="5" patternUnits="userSpaceOnUse">
